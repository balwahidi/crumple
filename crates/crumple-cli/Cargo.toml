[package]
publish = false
name = "crumple-cli"
description = "Command-line interface for Crumple, a local-first batch image optimizer (pre-alpha)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crumple"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
rayon = "=1.12.0"
imagesize = "=0.15.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crumple-core = { path = "../crumple-core" }
crumple-codecs = { path = "../crumple-codecs" }
crumple-metric = { path = "../crumple-metric" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"
